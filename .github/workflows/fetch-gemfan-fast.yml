name: fetch-gemfan-fast

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fetch-gemfan-fast.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Single-pass fetch of all product pages
        run: |
          mkdir -p gemfan_pages_fast .tmp
          ok=0
          fail=0
          while read -r url; do
            [ -z "$url" ] && continue
            name=${url##*/}
            if curl -sS -f --max-time 20 \
              -A "Mozilla/5.0 (compatible; ProductKnowledgeBaseBot/1.0)" \
              "$url" -o "gemfan_pages_fast/$name"; then
              ok=$((ok+1))
            else
              fail=$((fail+1))
              echo "FAIL $name"
            fi
            sleep 0.4
          done < .tmp/gemfan_urls.txt
          echo "fetched=$ok failed=$fail"
          tar -czf .tmp/gemfan_pages_fast.tar.gz gemfan_pages_fast
          ls -lh .tmp/gemfan_pages_fast.tar.gz

      - name: Commit fast-pass archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .tmp/gemfan_pages_fast.tar.gz
          git commit -m "chore: raw GEMFAN product pages (fast pass)" || echo "no changes"
          git pull --rebase origin main || true
          git push
