name: fetch-gemfan-pages

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fetch-gemfan-pages.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch every product detail page
        run: |
          mkdir -p gemfan_pages .tmp
          ok=0
          fail=0
          while read -r url; do
            [ -z "$url" ] && continue
            name=${url##*/}
            got=0
            for try in 1 2 3 4; do
              if curl -sS -f --max-time 45 \
                -A "Mozilla/5.0 (compatible; ProductKnowledgeBaseBot/1.0)" \
                "$url" -o "gemfan_pages/$name"; then
                got=1
                break
              fi
              sleep 5
            done
            if [ "$got" = 1 ]; then
              ok=$((ok+1))
            else
              fail=$((fail+1))
              echo "FAIL $name"
            fi
            sleep 1
          done < .tmp/gemfan_urls.txt
          echo "fetched=$ok failed=$fail"
          tar -czf .tmp/gemfan_pages.tar.gz gemfan_pages
          ls -lh .tmp/gemfan_pages.tar.gz

      - name: Commit raw archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .tmp/gemfan_pages.tar.gz
          git commit -m "chore: raw GEMFAN product pages archive" || echo "no changes"
          git push
