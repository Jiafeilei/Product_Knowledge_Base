name: fetch-betafpv-full-site

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fetch-betafpv-site.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch every products.json page
        run: |
          mkdir -p .tmp
          for page in $(seq 1 40); do
            ok=0
            for try in 1 2 3 4 5 6; do
              if curl -sS -f --max-time 90 \
                -A "Mozilla/5.0 (compatible; ProductKnowledgeBaseBot/1.0)" \
                "https://betafpv.com/products.json?limit=250&page=$page" \
                -o ".tmp/page$page.json"; then
                ok=1
                break
              fi
              echo "retry page $page ($try)"
              sleep 20
            done
            if [ "$ok" -ne 1 ]; then
              echo "FAILED to fetch page $page"
              exit 1
            fi
            count=$(python -c "import json;print(len(json.load(open('.tmp/page$page.json'))['products']))")
            echo "page $page: $count products"
            if [ "$count" -eq 0 ]; then
              rm -f ".tmp/page$page.json"
              break
            fi
            sleep 2
          done
          python -c "import json,glob; fs=sorted(glob.glob('.tmp/page*.json'), key=lambda p:int(p.split('page')[-1].split('.')[0])); seen={}; [seen.setdefault(x['id'],x) for f in fs for x in json.load(open(f))['products']]; json.dump({'count':len(seen),'products':list(seen.values()),'pages':len(fs)}, open('.tmp/site_all_products.json','w'), ensure_ascii=False); print('unique products:',len(seen),'pages:',len(fs))"

      - name: Commit raw snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .tmp/site_all_products.json
          git commit -m "chore: raw BETAFPV full-site snapshot" || echo "no changes"
          git push
