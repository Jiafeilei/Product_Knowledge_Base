name: fetch-betafpv-all-drone

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fetch-betafpv-all-drone.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch every all-drone collection page
        run: |
          mkdir -p .tmp
          for page in 1 2 3 4 5; do
            curl -sS -f --retry 6 --retry-delay 15 --retry-all-errors \
              -A "Mozilla/5.0 (compatible; ProductKnowledgeBaseBot/1.0)" \
              "https://betafpv.com/collections/all-drone/products.json?limit=250&page=$page" \
              -o ".tmp/page$page.json" || exit 1
            count=$(python -c "import json;print(len(json.load(open('.tmp/page$page.json'))['products']))")
            echo "page $page: $count products"
            if [ "$count" -eq 0 ]; then break; fi
            sleep 2
          done
          python -c "import json,glob; fs=sorted(glob.glob('.tmp/page*.json')); seen={}; [seen.setdefault(p['id'],p) for f in fs for p in json.load(open(f))['products']]; json.dump({'count':len(seen),'pages':len(fs),'products':list(seen.values())}, open('.tmp/all_drone_products.json','w'), ensure_ascii=False); print('unique products:',len(seen))"

      - name: Commit raw snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .tmp/all_drone_products.json
          git commit -m "chore: raw BETAFPV all-drone snapshot" || echo "no changes"
          git push
