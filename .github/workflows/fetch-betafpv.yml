name: fetch-betafpv-raw

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fetch-betafpv.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch collection pages
        run: |
          mkdir -p .tmp
          curl -sS -f --retry 6 --retry-delay 15 --retry-all-errors \
            -A "Mozilla/5.0 (compatible; ProductKnowledgeBaseBot/1.0)" \
            "https://betafpv.com/collections/all-drone/products.json?limit=250&page=1" \
            -o .tmp/page1.json
          curl -sS -f --retry 6 --retry-delay 15 --retry-all-errors \
            -A "Mozilla/5.0 (compatible; ProductKnowledgeBaseBot/1.0)" \
            "https://betafpv.com/collections/all-drone/products.json?limit=250&page=2" \
            -o .tmp/page2.json
          python -c "import json; a=json.load(open('.tmp/page1.json'))['products']; b=json.load(open('.tmp/page2.json'))['products']; seen={}; [seen.setdefault(p['id'],p) for p in a+b]; json.dump({'count':len(seen),'products':list(seen.values())}, open('.tmp/all_products.json','w'), ensure_ascii=False); print('unique products:',len(seen))"

      - name: Commit raw snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .tmp/all_products.json
          git commit -m "chore: raw BETAFPV all-drone collection snapshot" || echo "no changes"
          git push
